<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Command Desk</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="theme.local.css">
  <script src="vendor/marked.umd.js" defer></script>
  <script src="vendor/purify.min.js" defer></script>
  <script src="vendor/highlight.min.js" defer></script>
  <script src="queue.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#prompt">Přeskočit na psaní zprávy</a>

  <header class="top">
    <div class="brand">
      <span class="brand-name" id="brand-name">Agent Command Desk</span>
      <span class="motif motif--short" aria-hidden="true"></span>
    </div>

    <div class="controls">
      <fieldset class="seg" id="accounts">
        <legend class="eyebrow">Účet</legend>
      </fieldset>

      <label class="field">
        <span class="eyebrow">Projekt</span>
        <select id="project"></select>
      </label>

      <span class="git" id="git" title="Aktuální větev a počet změněných souborů"></span>
    </div>
  </header>

  <div class="layout">
    <aside class="side" aria-labelledby="sessions-title">
      <div class="side-head">
        <h2 class="eyebrow" id="sessions-title">Sezení</h2>
        <button type="button" class="btn btn-ghost btn-small" id="new-session">+ Nové</button>
      </div>
      <ul class="sessions" id="sessions"></ul>
    </aside>

    <main class="main">
      <div class="banner" id="banner" hidden></div>

      <section class="chat" id="chat" aria-label="Konverzace">
        <div class="empty" id="empty">
          <div class="motif motif--fill" aria-hidden="true"></div>
          <h1 class="empty-title">Co dnes uděláme</h1>
          <p class="empty-text">Napište zadání. Režim <strong>Plán</strong> nejdřív navrhne postup a nic nezmění,
            režim <strong>Auto</strong> rovnou pracuje.</p>
        </div>
      </section>

      <form class="composer" id="composer">
        <section class="queue" id="queue" aria-label="Fronta zpráv" hidden></section>
        <label for="prompt" class="sr-only">Zpráva pro Claude</label>
        <textarea id="prompt" rows="3" placeholder="Napište zprávu… (Ctrl+Enter odešle)" autocomplete="off"></textarea>
        <div class="composer-bar">
          <fieldset class="seg seg-mode" id="modes">
            <legend class="sr-only">Režim</legend>
            <label class="seg-item"><input type="radio" name="mode" value="auto" checked><span>Auto</span></label>
            <label class="seg-item"><input type="radio" name="mode" value="plan"><span>Plán</span></label>
          </fieldset>
          <span class="status" id="status" role="status" aria-live="polite"></span>
          <button type="button" class="btn btn-ghost" id="stop" hidden>Zastavit</button>
          <button type="submit" class="btn btn-accent" id="send">Odeslat</button>
        </div>
      </form>
    </main>
  </div>

  <footer class="foot" id="foot">
    <span id="foot-session">Nové sezení</span>
    <span id="foot-model"></span>
    <span id="foot-cost"></span>
  </footer>
</body>
</html>
